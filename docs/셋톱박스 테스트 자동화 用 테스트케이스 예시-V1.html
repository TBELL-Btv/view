<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>테스트케이스 예시 — Btv Wing UI · VOD Player</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F6F7FB; --surface:#FFFFFF; --ink:#141A2E; --muted:#5B6480; --line:#D9DDEA;
  --accent:#3B5BDB; --accent-soft:#E7EBFA; --code-bg:#EEF0F7;
  --notify:#B45309; --notify-soft:#FDF0DC;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1220; --surface:#171B2E; --ink:#E8EAF3; --muted:#9AA3C0; --line:#2A3050;
    --accent:#8AA0FF; --accent-soft:#1E2748; --code-bg:#1E2338;
    --notify:#F2B36B; --notify-soft:#3A2A14;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"IBM Plex Sans KR","Noto Sans KR",sans-serif;line-height:1.3;margin:0}
.wrap{max-width:1380px;margin:0 auto;padding:0 1.25rem 4rem}
header.doc{padding:2.2rem 0 1.4rem}
.kicker{color:var(--accent);font-weight:700;font-size:.85rem;letter-spacing:.06em;margin-bottom:.4rem}
h1{font-size:1.7rem;font-weight:700}
.sub{color:var(--muted);font-size:.9rem;margin-top:.5rem}
/* 탭 */
.tabs{display:flex;gap:.5rem;margin:1.2rem 0 1rem;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:.45rem 1.1rem;font-size:.92rem;font-weight:700;cursor:pointer;font-family:inherit}
.tab .n{color:var(--muted);font-weight:500;margin-left:.35rem}
.tab .poc{color:var(--accent);font-weight:700;font-size:.78em;margin-right:.4rem}
.tab.on{border-color:var(--accent);background:var(--accent-soft)}
.search{flex:1;min-width:180px;display:flex}
.search input{flex:1;border:1.5px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);padding:.45rem 1rem;font:inherit;font-size:.9rem}
.search input:focus{outline:none;border-color:var(--accent)}
/* 본문 레이아웃 */
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:1.2rem;align-items:start}
@media(max-width:920px){.layout{grid-template-columns:1fr}}
/* 목록 */
.list{display:flex;flex-direction:column;gap:.55rem}
@media(min-width:921px){.list{position:sticky;top:1rem;max-height:calc(100vh - 2rem);overflow-y:auto;padding-right:.2rem}}
.card{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:.65rem .85rem;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.card:hover{border-color:var(--accent)}
.card.on{border-color:var(--accent);background:var(--accent-soft)}
.card .cid{font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--accent);font-weight:600}
.card .ct{font-size:.88rem;font-weight:600;margin:.15rem 0 .3rem;line-height:1.4}
.card .cm{font-size:.74rem;color:var(--muted)}
.card .cm b{color:var(--muted);font-weight:600}
.empty{color:var(--muted);font-size:.88rem;padding:1rem .3rem}
/* 상세 */
.detail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.4rem 1.6rem;min-height:300px}
.detail .cid{font-family:"IBM Plex Mono",monospace;font-size:.82rem;color:var(--accent);font-weight:600}
.detail h2{font-size:1.25rem;margin:.3rem 0 .2rem;border:none;padding:0}
.detail .src{font-size:.78rem;color:var(--muted)}
.scen{border-top:1px solid var(--line);margin-top:1.3rem;padding-top:1.2rem}
.scen:first-of-type{border-top:none;margin-top:1rem;padding-top:0}
.scenlbl{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.82rem;border-radius:6px;padding:.15rem .6rem;margin-bottom:.7rem}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:1.3rem}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.fld{margin-bottom:1rem}
.fld .lb{font-size:.76rem;font-weight:700;color:var(--muted);letter-spacing:.05em;margin-bottom:.3rem}
.fld .tx{white-space:pre-line;font-size:.92rem}
.fld.data .tx{background:var(--notify-soft);color:inherit;border-left:3px solid var(--notify);border-radius:0 8px 8px 0;padding:.5rem .8rem;font-size:.86rem}
.fld.expect .tx{background:var(--code-bg);border-radius:8px;padding:.6rem .9rem}
.shots{display:flex;flex-direction:column;gap:.9rem}
.shot img{width:100%;display:block;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.shot .cap{font-size:.78rem;color:var(--muted);margin-top:.35rem;line-height:1.5}
.shot .cap b{color:var(--ink)}
.noimg{border:1.5px dashed var(--line);border-radius:8px;color:var(--muted);font-size:.8rem;padding:.8rem;text-align:center}
.placeholder{color:var(--muted);padding:3rem 1rem;text-align:center;font-size:.95rem}
/* 라이트박스 */
.lb-ov{position:fixed;inset:0;background:rgba(8,10,20,.88);display:none;align-items:center;justify-content:center;z-index:50;flex-direction:column;padding:2rem;cursor:zoom-out}
.lb-ov.on{display:flex}
.lb-ov img{max-width:min(1200px,96vw);max-height:82vh;border-radius:10px}
.lb-ov .cap{color:#cdd3ea;font-size:.88rem;margin-top:.8rem;max-width:900px;text-align:center}
@media print{.tabs,.search,.list{display:none}.layout{grid-template-columns:1fr}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
  <header class="doc">
    <div class="kicker">테스트케이스 예시 문서 · V1</div>
    <h1>Btv Wing UI · VOD Player 테스트케이스</h1>
    <div class="sub">원본: 테스트케이스 엑셀 2종(Wing UI · VOD플레이어) + 실측 스크린샷 세트 — 케이스를 클릭하면 수행절차·기대결과와 참고 화면을 함께 볼 수 있습니다.</div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="layout">
    <div class="list" id="list"></div>
    <div class="detail" id="detail"><div class="placeholder">좌측 목록에서 테스트케이스를 선택하세요</div></div>
  </div>
</div>

<div class="lb-ov" id="lb" onclick="this.classList.remove('on')">
  <img id="lbimg" alt=""><div class="cap" id="lbcap"></div>
</div>

<script>

UAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQB//2Q=="};

let gid = DATA.groups[0].gid, sel = null, q = '';

const $ = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function grp(){ return DATA.groups.find(g => g.gid === gid); }

function renderTabs(){
  let h = DATA.groups.map(g =>
    `<button class="tab ${g.gid===gid?'on':''}" onclick="setG('${g.gid}')"><span class="poc">${g.poc}</span>${g.name}<span class="n">${g.cases.length}건</span></button>`
  ).join('');
  h += `<div class="search"><input placeholder="번호·제목·내용 검색" value="${esc(q)}" oninput="setQ(this.value)"></div>`;
  $('tabs').innerHTML = h;
}

function hit(c){
  if(!q) return true;
  const t = q.toLowerCase();
  const blob = [c.id, c.title, ...c.scens.map(s => s.label+' '+s.steps+' '+s.data+' '+s.expect)].join(' ').toLowerCase();
  return blob.includes(t);
}

function renderList(){
  const cs = grp().cases.filter(hit);
  if(!cs.length){ $('list').innerHTML = '<div class="empty">검색 결과가 없습니다</div>'; return; }
  $('list').innerHTML = cs.map(c => {
    const ni = c.scens.reduce((a,s)=>a+s.imgs.length,0);
    return `<button class="card ${sel===c.id?'on':''}" onclick="setC('${c.id}')">
      <div class="cid">${esc(c.id)}</div>
      <div class="ct">${esc(c.title)}</div>
      <div class="cm">시나리오 <b>${c.scens.length}</b> · 참고 이미지 <b>${ni}</b></div>
    </button>`;
  }).join('');
}

function imgBlock(p){
  const cap = DATA.captions[p] || '';
  if(IMGS[p]){
    return `<div class="shot"><img src="data:image/jpeg;base64,${IMGS[p]}" alt="${esc(cap||p)}" loading="lazy"
      onclick="openLb(this.src, '${esc((cap? cap+' — ':'')+p).replace(/'/g,'&#39;')}')">
      <div class="cap">${cap?'<b>'+esc(cap)+'</b><br>':''}${esc(p)}</div></div>`;
  }
  return `<div class="noimg">이미지 미포함<br>${esc(p)}</div>`;
}

function renderDetail(){
  const c = grp().cases.find(x => x.id === sel);
  if(!c){ $('detail').innerHTML = '<div class="placeholder">좌측 목록에서 테스트케이스를 선택하세요</div>'; return; }
  let h = `<div class="cid">${esc(c.id)}</div><h2>${esc(c.title)}</h2>
           <div class="src">원본 시트: ${grp().gid==='vod'?'테스트케이스 - VOD플레이어.xlsx':'테스트케이스 - Wing UI.xlsx'}</div>`;
  c.scens.forEach((s,i) => {
    h += `<div class="scen">`;
    h += `<div class="scenlbl">${s.label ? esc(s.label) : '시나리오 ' + (i+1)}</div>`;
    h += `<div class="cols"><div>`;
    if(s.steps)  h += `<div class="fld"><div class="lb">수행 절차</div><div class="tx">${esc(s.steps)}</div></div>`;
    if(s.data)   h += `<div class="fld data"><div class="lb">데이터 · 조건</div><div class="tx">${esc(s.data)}</div></div>`;
    if(s.expect) h += `<div class="fld expect"><div class="lb">기대 결과</div><div class="tx">${esc(s.expect)}</div></div>`;
    h += `</div><div class="shots">`;
    h += s.imgs.length ? s.imgs.map(imgBlock).join('') : '<div class="noimg">참고 이미지 없음</div>';
    h += `</div></div></div>`;
  });
  $('detail').innerHTML = h;
}

function setG(g){ gid = g; sel = null; renderTabs(); renderList(); renderDetail(); }
function setC(id){
  sel = id; renderList(); renderDetail();
  if(window.innerWidth < 921) $('detail').scrollIntoView({behavior:'smooth'});
}
function setQ(v){ q = v; renderList(); }
function openLb(src, cap){ $('lbimg').src = src; $('lbcap').textContent = cap.replace(/&#39;/g,"'"); $('lb').classList.add('on'); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') $('lb').classList.remove('on'); });

renderTabs(); renderList();
const first = grp().cases[0]; if(first){ sel = first.id; renderList(); renderDetail(); }
</script>
