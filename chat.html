<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Btv Lab Chat</title>
  <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div>
      <p class="kicker">TBELL-Btv / view</p>
      <h1>구문 챗봇</h1>
    </div>
    <nav>
      <a href="index.html">결과</a>
      <a class="on" href="chat.html">챗봇</a>
    </nav>
  </header>
  <main>
    <section class="panel">
      <p class="muted">문의: 결과/문서 질문 · 실행: POC 스위트 · 변경: docs PR (승인 후 테스트 코드 자동 반영)</p>
      <div id="log" class="log"></div>
      <form id="form" class="composer">
        <input id="q" autocomplete="off" placeholder="테스트 진행">
        <button type="submit">보내기</button>
      </form>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>bootChat()</script>

</html>
